<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f5f3ec">
<title>魚仔美甲 Fry Nails 價格計算機</title>
<style>
:root{--bg:#f5f3ec;--card:#ffffff;--tx:#1a3d7c;--sub:#1a3d7c;--pri:#1a3d7c;--soft:#e8ecf4;--bd:#d5dae6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#f5f3ec;color-scheme:light only;min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f3ec;color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.4}
.total{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#1a3d7c;color:#ffffff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0003}
.total small{color:#ffffff;font-size:13px}.clr{margin-top:6px;background:#ffffff;color:#1a3d7c;border:0;border-radius:16px;padding:5px 14px;font-size:13px;font-weight:700}
.total b{font-size:32px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;text-align:center;margin:8px 0 2px}.sb{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;display:inline-block;background:var(--soft);padding:4px 14px;border-radius:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px dashed var(--bd);cursor:pointer}
.row:first-of-type{border-top:0}
.row span small{display:block;color:var(--sub);font-size:12px}
.row input[type=radio],.row input[type=checkbox]{accent-color:var(--pri);width:18px;height:18px;margin-right:8px}
.l{display:flex;align-items:center}.p{font-weight:700;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:18px}
.step .all{width:auto;border-radius:16px;padding:0 10px;font-size:12px}
.step em{min-width:22px;text-align:center;font-style:normal;font-weight:700}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:6px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum .n{color:var(--sub)}.note{color:var(--sub);font-size:12px;text-align:center;margin:6px 0 20px}
</style></head><body>
<div class="total"><div><small>總金額 (NT$)</small><br><button type="button" class="clr" onclick="clearAll()">一鍵清除</button></div><b id="tot">0</b></div>
<div class="wrap">
<h1>魚仔美甲 Fry Nails</h1><div class="sb">價格計算機・預設十指</div>

<div class="card"><h2>美甲服務(擇一)</h2><div id="styles"></div>
<div class="row" id="jumpRow"><label class="l"><input type="checkbox" id="jump"><span>跳色不限量<small>單色、貓眼璀璨、漸層適用</small></span></label><span class="p">+50</span></div></div>

<div class="card"><h2>加購裝飾</h2><div id="deco"></div></div>
<div class="card"><h2>其他服務</h2><div id="other"></div></div>

<div class="card"><h2>卸甲服務</h2>
<label class="row"><span class="l"><input type="radio" name="rm" value="none" checked><span>不卸甲</span></span><span class="p"></span></label><label class="row"><span class="l"><input type="radio" name="rm" value="150"><span>本店、續作</span></span><span class="p">150</span></label><label class="row"><span class="l"><input type="radio" name="rm" value="300"><span>本店、不續做</span></span><span class="p">300</span></label><label class="row"><span class="l"><input type="radio" name="rm" value="250"><span>他店、續作</span></span><span class="p">250</span></label><label class="row"><span class="l"><input type="radio" name="rm" value="400"><span>他店、不續做</span></span><span class="p">400</span></label>
<div class="row" style="cursor:default"><span>卸大鑽、飾品、立體造型<small>75 / 手</small></span>
<div class="step"><button onclick="hand(-1)">−</button><em id="hc">0</em><button onclick="hand(1)">+</button></div></div></div>

<div class="card"><h2>優惠</h2>
<label class="row"><span class="l"><input type="checkbox" id="w3"><span>三週內換甲免卸甲費</span></span><span class="p">免卸甲費</span></label>
<label class="row"><span class="l"><input type="checkbox" id="pic"><span>配合拍攝作品並同意發布於魚仔社群<small>即可享有優惠</small></span></span><span class="p">−50</span></label></div>

<div class="card sum"><h2>明細</h2><div id="sum"></div></div>
<div class="note">依價目表試算,實際金額以店家報價為準。「up」項目為起算價。</div>
</div>
<script>
const STYLES=[["基礎保養",350],["透明凝膠",500],["單色",600,1],["貓眼、璀璨",700,1],["漸層",800,1],["腮紅、漸層貓眼",850],["腮紅貓眼",900],["鏡面(不指定法式)",950],["指定造型款",950,0,"起"],["不指定造型款",950,0,"起","可選色系、風格、預算"]];
const DECO=[["半鑽",50],["滿鑽",100]];
const OTHER=[["斷甲補甲",50],["延甲",75],["塑形",25]];
let F=10,H=0,X={8:0,9:0},q={},style=-1;
const $=id=>document.getElementById(id);
$("styles").innerHTML=STYLES.map((s,i)=>`<label class="row"><span class="l"><input type="radio" name="st" value="${i}"><span>${s[0]}${s[4]?`<small>${s[4]}</small>`:""}</span></span>${s[3]?`<div class="step"><button type="button" onclick="up(${i},-1)">−</button><em id="ux${i}" style="min-width:52px;font-weight:700">950</em><button type="button" onclick="up(${i},1)">+</button></div>`:`<span class="p">${s[1]}</span>`}</label>`).join("");
const stepper=(a,k)=>a.map((x,i)=>`<div class="row" style="cursor:default"><span>${x[0]}<small>${x[1]} / 指</small></span><div class="step"><button onclick="qty('${k}${i}',-1)">−</button><em id="q${k}${i}">0</em><button onclick="qty('${k}${i}',1)">+</button><button class="all" onclick="qty('${k}${i}',99)">全指</button></div></div>`).join("");
$("deco").innerHTML=stepper(DECO,"d")+`<label class="row"><span class="l"><input type="checkbox" id="stk"><span>貼紙不限量</span></span><span class="p">50</span></label>`;
$("other").innerHTML=stepper(OTHER,"o")+`<label class="row"><span class="l"><input type="checkbox" id="thick"><span>厚建構</span></span><span class="p">150</span></label>`;
function qty(k,d){q[k]=Math.max(0,Math.min(F,d==99?F:(q[k]||0)+d));calc()}
function up(i,d){X[i]=Math.max(0,X[i]+d*50);document.querySelector(`input[name=st][value="${i}"]`).checked=true;calc()}
function clearAll(){
 document.querySelectorAll('input[name=st]').forEach(e=>e.checked=false);
 document.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=false);
 document.querySelector('input[name=rm][value=none]').checked=true;
 q={};H=0;X={8:0,9:0};calc();window.scrollTo({top:0,behavior:"smooth"})}
function hand(d){H=Math.max(0,Math.min(2,H+d));calc()}
function calc(){
 const L=[];const add=(n,v)=>{if(v)L.push([n,v])};
 const si=document.querySelector('input[name=st]:checked');style=si?+si.value:-1;
 const S=STYLES[style];
 $("jumpRow").style.opacity=S&&S[2]?1:.4;
 for(const i in X)$("ux"+i).textContent=950+X[i];
 if(S){add(S[0]+(S[3]?"(起)":""),S[1]);if(S[2]&&$("jump").checked)add("跳色不限量",50);if(S[3])add("款式加價",X[style])}
 DECO.forEach((x,i)=>{const n=q["d"+i]||0;$("qd"+i).textContent=n;add(`${x[0]} × ${n}指`,n*x[1])});
 if($("stk").checked)add("貼紙不限量",50);
 OTHER.forEach((x,i)=>{const n=q["o"+i]||0;$("qo"+i).textContent=n;add(`${x[0]} × ${n}指`,n*x[1])});
 if($("thick").checked)add("厚建構",150);
 const rm=document.querySelector('input[name=rm]:checked').value;
 if(rm!="none"){const nm=document.querySelector('input[name=rm]:checked').parentNode.textContent.trim();
  if($("w3").checked)L.push(["卸甲費(三週內免)",0]);else add("卸甲 "+nm,+rm)}
 $("hc").textContent=H;add(`卸大鑽/飾品/立體 × ${H}手`,H*75);
 if($("pic").checked)add("拍攝發布優惠",-50);
 const t=Math.max(0,L.reduce((a,b)=>a+b[1],0));
 $("tot").textContent=t.toLocaleString();
 $("sum").innerHTML=L.length?L.map(x=>`<div><span>${x[0]}</span><span>${x[1]<0?"−":""}${Math.abs(x[1])}</span></div>`).join("")+`<div style="border-top:1px solid var(--bd);margin-top:4px;padding-top:8px;font-weight:700"><span>合計</span><span>${t}</span></div>`:`<div class="n">尚未選擇項目</div>`;
}
document.addEventListener("change",calc);calc();
</script></body></html>
