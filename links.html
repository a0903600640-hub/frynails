<style>
:root{
  --ink:#2b3a52; --ink-soft:#5d6c85; --glass:rgba(255,255,255,.55);
  --edge:rgba(255,255,255,.9); --accent:#7f93bd;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{
  min-height:100%;color:var(--ink);
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;font-weight:300;
  background:#e9eef5 url("link-bg.jpg") center top/cover no-repeat fixed;
  padding:max(48px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
}
main{max-width:460px;margin:0 auto;text-align:center}
h1{
  font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;
  font-size:clamp(2.4rem,11vw,3.2rem);letter-spacing:.02em;line-height:1.1;
}
.bio{margin:12px 0 32px;color:var(--ink-soft);font-size:.95rem;letter-spacing:.12em}

.links{display:grid;gap:12px;list-style:none;padding:0}
.links a{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 22px;border-radius:999px;text-decoration:none;color:var(--ink);
  background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 6px 24px rgba(110,135,175,.16), inset 0 1px 0 rgba(255,255,255,.8);
  font-size:1.02rem;letter-spacing:.08em;
  transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
}
.links a small{font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
.links a:hover,.links a:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.8);box-shadow:0 10px 28px rgba(110,135,175,.28)}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.links .book a{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 8px 26px rgba(43,58,82,.35)}
.links .book a small{color:#cfd8ea}
.links .book a:hover{background:#1f2c42}

h2{font-weight:400;font-size:1rem;letter-spacing:.2em;margin:44px 0 14px;color:var(--ink-soft)}
.works{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -20px;padding:4px 20px 16px;scrollbar-width:none;
}
.works::-webkit-scrollbar{display:none}
.works img{
  flex:0 0 68%;max-width:290px;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center;
  border-radius:22px;border:1px solid var(--edge);
  box-shadow:0 10px 28px rgba(110,135,175,.25);background:#dfe6f0;
}
footer{margin-top:28px;font-size:.78rem;color:var(--ink-soft);letter-spacing:.1em}

.intro{animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro{animation:none}.links a{transition:none}}
